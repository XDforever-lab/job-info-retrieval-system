{% extends "base.html" %}

{% block title %}首页 - 上市公司招聘信息检索系统{% endblock %}

{% block content %}
<div class="search-hero">
  <h1 class="search-title">上市公司招聘信息检索</h1>
  <p class="search-subtitle">覆盖 8,796 家中国 A 股上市公司 · 81 个行业 · 93,602 条招聘记录</p>

  <!-- 搜索框 -->
  <form action="/search" method="get" class="search-form">
    <div class="search-input-row">
      <input type="text" name="q" class="search-input"
             placeholder="输入岗位、技能或公司关键词搜索..." autofocus>
      <button type="submit" class="search-btn">🔍 搜索</button>
    </div>
  </form>

  <!-- 快捷筛选 -->
  <div class="quick-filters">
    <form action="/search" method="get" class="filter-inline">
      <select name="industry" class="quick-select">
        <option value="">所有行业</option>
        {% for ind in industries %}
        <option value="{{ ind }}">{{ ind }}</option>
        {% endfor %}
      </select>
      <select name="city" class="quick-select">
        <option value="">所有城市</option>
        {% for city in cities %}
        <option value="{{ city }}">{{ city }}</option>
        {% endfor %}
      </select>
      <select name="education" class="quick-select">
        <option value="">学历不限</option>
        <option value="本科">本科</option>
        <option value="硕士">硕士</option>
        <option value="博士">博士</option>
        <option value="大专">大专</option>
      </select>
      <button type="submit" class="filter-btn">筛选</button>
    </form>
  </div>
</div>

<!-- 热门行业快捷入口 -->
<section class="section">
  <h2 class="section-title">热门行业</h2>
  <div class="industry-grid" id="hot-industries">
    <div class="loading">加载中...</div>
  </div>
</section>

<!-- 最新招聘 -->
<section class="section">
  <h2 class="section-title">最新招聘信息</h2>
  <div class="job-list" id="latest-jobs">
    <div class="loading">加载中...</div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
